name: CI

on:
  push:
    branches: [next, main]
  pull_request:

jobs:
  test:
    name: unit tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  smoke:
    name: cli smoke (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: galcode --help
        run: node bin/galcode.js --help

      # CI has no dsh profile and no vendored WebGAL engine; advisory mode
      # prints the full report without failing the job.
      - name: galcode doctor (advisory)
        run: node bin/galcode.js doctor --advisory

      - name: galcode cli yolo --offline
        run: node bin/galcode.js cli yolo --offline --duration 5 --out outputs/ci-smoke

      - name: compiled WebGAL script exists
        shell: bash
        run: |
          test -f outputs/ci-smoke/game/scene/start.txt
          grep -q "^end;" outputs/ci-smoke/game/scene/start.txt
